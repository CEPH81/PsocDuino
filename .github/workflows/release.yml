name: release

# Para publicar una version en el Gestor de placas: cambie "version=" en
# platform.txt y haga push a main. Si el Release vX.Y.Z no existe se crea
# (etiqueta, paquete .tar.bz2 e indice package_psocduino_index.json).
on:
  push:
    branches: [main]
    paths: ['platform.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      nuevo: ${{ steps.v.outputs.nuevo }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="v$(sed -n 's/^version=//p' platform.txt | tr -d '\r')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "nuevo=no" >> "$GITHUB_OUTPUT"; echo "$TAG ya publicado"
          else
            echo "nuevo=si" >> "$GITHUB_OUTPUT"; echo "publicando $TAG"
          fi

  compilar:
    needs: version
    if: needs.version.outputs.nuevo == 'si'
    uses: ./.github/workflows/psocprog.yml

  paquete:
    needs: [version, compilar]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Binarios recien compilados
        run: |
          cp art/psocduino-tools-windows-x86/*.exe tools/bin/windows/
          mkdir -p tools/bin/windows-x64 && cp art/psocduino-tools-windows-x64/*.exe tools/bin/windows-x64/
          cp art/psocduino-tools-linux-x86_64/* tools/bin/linux/ && chmod +x tools/bin/linux/*
          cp art/psocduino-tools-macos-arm64/* tools/bin/macos/ && chmod +x tools/bin/macos/*
      - name: Empaquetar y publicar el Release
        run: |
          python3 tools/packaging/make_release.py "$TAG" --out dist
          V="${TAG#v}"
          cat > notes.md <<EOT
          PsocDuino $V para el Gestor de placas del Arduino IDE 2.x.

          URL para *Preferencias -> URLs adicionales de gestor de placas*:

              https://raw.githubusercontent.com/CEPH81/PsocDuino/main/package_psocduino_index.json

          Guia: docs/instalacion.md
          EOT
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "PsocDuino $V" --notes-file notes.md
          gh release upload "$TAG" dist/*.tar.bz2 --clobber
      - name: Actualizar el indice en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package_psocduino_index.json   # los binarios del repo los publica psocprog.yml
          git commit -m "Gestor de placas: PsocDuino $TAG [skip ci]" || exit 0
          git reset -q --hard HEAD   # descartar binarios copiados solo para el paquete
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "no se pudo actualizar el indice"; exit 1; }
