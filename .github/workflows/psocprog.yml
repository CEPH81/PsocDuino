name: herramientas

on:
  push:
    paths: ['tools/**', 'cores/**', 'tests/**', '.github/workflows/psocprog.yml']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Tests (simulador)
        working-directory: tools/psocprog
        run: make test
      - name: Prueba del nucleo (C89)
        run: |
          gcc -std=c89 -pedantic -Wall -Werror -Wno-unused-parameter -DPSOCDUINO_HOST_TEST -Icores/psoc1 \
            -o core_test tests/core_host_test.c cores/psoc1/wiring_digital.c cores/psoc1/wiring.c
          ./core_test
      - name: Build
        run: |
          make -C tools/psocprog -B USB_LIBS="-Wl,-Bstatic $(pkg-config --variable=libdir libusb-1.0)/libusb-1.0.a -Wl,-Bdynamic -ludev -lpthread"
          make -C tools/psocbuild
          mkdir -p dist && cp tools/psocprog/psocprog tools/psocbuild/psocbuild dist/
      - uses: actions/upload-artifact@v4
        with: { name: psocduino-tools-linux-x86_64, path: dist/ }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install libusb
      - name: Tests + build
        working-directory: tools/psocprog
        run: |
          make test
          make -B USB_LIBS="$(brew --prefix libusb)/lib/libusb-1.0.a -framework IOKit -framework CoreFoundation -framework Security"
          make -C ../psocbuild
          mkdir -p ../../dist && cp psocprog ../psocbuild/psocbuild ../../dist/
      - uses: actions/upload-artifact@v4
        with: { name: psocduino-tools-macos-arm64, path: dist/ }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        include:
          - { sys: mingw32, name: windows-x86 }   # carga CH341DLL.DLL (32 bits)
          - { sys: mingw64, name: windows-x64 }   # carga CH341DLLA64.DLL
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: make
          pacboy: gcc:p
      - name: Build (psocprog con backend DLL + psocbuild)
        run: |
          make -C tools/psocprog CC=gcc NO_LIBUSB=1 CFLAGS="-O2 -static" psocprog
          make -C tools/psocbuild CC=gcc CFLAGS="-O2 -static"
          ./tools/psocprog/psocprog.exe --version
          ./tools/psocprog/psocprog.exe -b sim:CY8C29466
          ./tools/psocbuild/psocbuild.exe --version
          mkdir -p dist && cp tools/psocprog/psocprog.exe tools/psocbuild/psocbuild.exe dist/
      - uses: actions/upload-artifact@v4
        with: { name: 'psocduino-tools-${{ matrix.name }}', path: dist/ }
